version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: ppo_cource
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ppo_cource"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-runner:
    build:
      context: ..
      dockerfile: docker/tests/Dockerfile
    environment:
      POSTGRES_DSN: postgres://admin:admin123@postgres:5432/ppo_cource?sslmode=disable
      REPO_URL: ${REPO_URL:-}
      REPO_REF: ${REPO_REF:-}
      RUN_TRAFFIC_CAPTURE: ${RUN_TRAFFIC_CAPTURE:-1}
      BDD_TECH_PASSWORD: ${BDD_TECH_PASSWORD:-}
      BDD_TECH_LOGIN_DOMAIN: ${BDD_TECH_LOGIN_DOMAIN:-}
      BDD_TECH_LOGIN_PREFIX: ${BDD_TECH_LOGIN_PREFIX:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../code/product/test-report:/workspace/code/product/test-report
