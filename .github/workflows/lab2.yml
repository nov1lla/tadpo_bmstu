name: lab-02-tests

on:
  push:
    branches: ["lab_02"]
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Allure history artifact
        id: allure_history
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const found = data.artifacts.find(a => a.name === "allure-history" && !a.expired);
              core.setOutput("found", found ? "true" : "false");
            } catch (err) {
              core.setOutput("found", "false");
              core.notice(`Allure history check skipped: ${err.message}`);
            }

      - name: Download Allure history
        uses: actions/download-artifact@v4
        if: steps.allure_history.outputs.found == 'true'
        with:
          name: allure-history
          path: code/product/test-report/allure-history

      - name: Prepare report dir
        run: |
          mkdir -p code/product/test-report

      - name: Run tests in Docker
        env:
          REPO_URL: https://${{ secrets.REPO_READ_TOKEN }}@github.com/robodanill/TADPO.git
          REPO_REF: ${{ github.sha }}
          RUN_TRAFFIC_CAPTURE: 1
        run: |
          docker compose -f docker/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test-runner

      - name: Shutdown containers
        if: always()
        run: |
          docker compose -f docker/docker-compose.test.yml down -v

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: code/product/test-report

      - name: Upload Allure history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: code/product/test-report/allure-history
