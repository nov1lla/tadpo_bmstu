name: lab-02-tests

on:
  push:
    branches: ["lab_02"]
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Allure history
        uses: dawidd6/action-download-artifact@v4
        with:
          workflow: lab2.yml
          name: allure-history
          path: code/product/test-report/allure-history
          if_no_artifact_found: warn

      - name: Prepare report dir
        run: |
          mkdir -p code/product/test-report
          mkdir -p code/product/test-report/allure-history

      - name: Run tests in Docker
        env:
          REPO_URL: https://${{ secrets.REPO_READ_TOKEN }}@github.com/nov1lla/tadpo_bmstu.git
          REPO_REF: ${{ github.sha }}
          RUN_TRAFFIC_CAPTURE: 1
        run: |
          docker compose -f docker/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test-runner

      - name: Shutdown containers
        if: always()
        run: |
          docker compose -f docker/docker-compose.test.yml down -v

      - name: Ensure report artifacts
        if: always()
        run: |
          sudo chown -R "$USER":"$USER" code/product/test-report || true
          mkdir -p code/product/test-report/allure-history
          touch code/product/test-report/allure-history/.keep
          mkdir -p code/product/test-report
          touch code/product/test-report/.keep

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: code/product/test-report

      - name: Upload Allure history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: code/product/test-report/allure-history
