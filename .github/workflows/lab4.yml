name: lab-04-bdd-e2e-auth

on:
  push:
    branches: ["lab_04"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests in Docker (unit -> integration -> e2e -> bdd)
        env:
          RUN_TRAFFIC_CAPTURE: 0
          BDD_TECH_PASSWORD: ${{ secrets.BDD_TECH_PASSWORD }}
        run: |
          docker compose -f docker/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test-runner

      - name: Shutdown containers
        if: always()
        run: |
          docker compose -f docker/docker-compose.test.yml down -v

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: code/product/test-report
